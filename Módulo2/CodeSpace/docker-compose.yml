services:
  db:
    image: postgres:15
    container_name: postgres-clase
    restart: unless-stopped

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
      POSTGRES_DB: infotec-db

    ports:
      - "5433:5432"

    volumes:
      - pg_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d infotec-db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data: